<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Notes | LogHue</title>

    <link rel="stylesheet" href="https://ui.scybud.com/css/variables.css" />   

    <link rel="stylesheet" href="/css/base.css">

    <style>
       html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        text-align: center;
      }

      .tunedText {
        text-align: center;
      }
      h1 {
        margin: 20px 0;
      }

      .loader {
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid var(--primary-light);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
</head>
<body>
      <!--Page responsible for loading notes that are linked to a task-->
      <div class="box">
            <p class="tunedText">Loading note...</p>
            <div class="loader">
                  
            </div>
      </div>

      <script>
            const noteId = new URLSearchParams(window.location.search).get("note")
            
            if(!noteId) {
                  window.location.href = "/tasks"
            } else {
                  window.location.href = `https://notes.loghue.com/notes/editor?note=${noteId}`
            }
      </script>
</body>
</html>
