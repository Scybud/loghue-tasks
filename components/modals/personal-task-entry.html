<div class="modalContainer" id="inputContainer">
  <form class="personalLogInputContainer form taskForm" novalidate>
    <!--CLOSE BUTTON-->
    <button type="button" class="closeModalBtn">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M18 6L6 18" />
        <path d="M6 6L18 18" />
      </svg>
    </button>

    <div class="modalTitleRow">
      <h2>Create Task</h2>
    </div>

    <input
      placeholder="What needs doing?"
      type="text"
      id="task"
      class="inputField"
      aria-label="Task title"
      autocomplete="off"
    />

    <!-- Values read by attachCreatePersonalTaskEvent, written by taskForm.ts -->
    <input type="hidden" id="taskTime" />
    <input type="hidden" id="taskStartTime" />
    <input type="hidden" id="taskEndTime" />
    <input type="checkbox" id="isRecurring" hidden />

    <!-- DUE -->
    <div class="taskFormSection">
      <span class="taskFormLabel" id="taskDueLabel">Due</span>
      <div class="taskFormRow" role="group" aria-labelledby="taskDueLabel">
        <span class="taskChipGroup" id="taskDueChips">
          <button type="button" class="taskChip iconCal" data-due="today" aria-pressed="false">Today</button>
          <button type="button" class="taskChip iconCal" data-due="tomorrow" aria-pressed="false">Tomorrow</button>
          <span class="taskDatePick">
            <button type="button" class="taskChip iconCal" data-due="date" aria-pressed="false">
              <span id="taskDueDateText">Pick a date</span>
            </button>
            <input type="date" id="taskDueDate" tabindex="-1" aria-hidden="true" />
          </span>
        </span>
        <span class="taskTimeField" id="taskDueTimeField" hidden>
          <label for="taskDueTime" id="taskDueTimeLabel">at</label>
          <input type="time" id="taskDueTime" class="inputField taskTimeInput" />
        </span>
      </div>
      <p class="taskFormHint" id="taskDueHint">No date puts it in Later.</p>
    </div>

    <!-- ADD -->
    <div class="taskFormSection">
      <span class="taskFormLabel" id="taskAddLabel">Add</span>
      <div class="taskFormRow" role="group" aria-labelledby="taskAddLabel">
        <button type="button" class="taskChip taskChipAdd iconPlus" data-feature="block" aria-pressed="false" aria-controls="taskFold-block">Time block</button>
        <button type="button" class="taskChip taskChipAdd iconPlus" data-feature="repeat" aria-pressed="false" aria-controls="taskFold-repeat">Repeat</button>
        <button type="button" class="taskChip taskChipAdd iconPlus" data-feature="note" aria-expanded="false" aria-controls="taskFold-note">Note</button>
      </div>

      <div class="taskFold" id="taskFold-block" inert>
        <div>
          <div class="taskPanel">
            <div class="taskFormRow" id="taskBlockDayRow">
              <label for="taskBlockDate">Day</label>
              <input type="date" id="taskBlockDate" class="inputField taskDateInput" />
            </div>
            <div class="taskFormRow">
              <label for="taskStartClock">Start</label>
              <input type="time" id="taskStartClock" class="inputField taskTimeInput" />
              <label for="taskEndClock">End</label>
              <input type="time" id="taskEndClock" class="inputField taskTimeInput" />
              <span class="taskFormMuted" id="taskBlockDuration"></span>
            </div>
            <p class="taskFormHint" id="taskBlockHint"></p>
          </div>
        </div>
      </div>

      <div class="taskFold" id="taskFold-repeat" inert>
        <div>
          <div class="taskPanel">
            <div class="taskFormSection">
              <span class="taskFormLabel">Repeats</span>
              <div class="taskFormRow"><span class="taskChip is-on">Daily</span></div>
            </div>
            <div class="taskFormSection">
              <span class="taskFormLabel">Remind on</span>
              <div class="taskFormRow">
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="0" aria-label="Sunday" checked /><span aria-hidden="true">S</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="1" aria-label="Monday" checked /><span aria-hidden="true">M</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="2" aria-label="Tuesday" checked /><span aria-hidden="true">T</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="3" aria-label="Wednesday" checked /><span aria-hidden="true">W</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="4" aria-label="Thursday" checked /><span aria-hidden="true">T</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="5" aria-label="Friday" checked /><span aria-hidden="true">F</span></label>
                <label class="taskDay"><input type="checkbox" class="reminderDayCheck" value="6" aria-label="Saturday" checked /><span aria-hidden="true">S</span></label>
              </div>
            </div>
            <p class="taskFormHint" id="taskRepeatHint"></p>
          </div>
        </div>
      </div>

      <div class="taskFold" id="taskFold-note" inert>
        <div>
          <div class="taskPanel">
            <label class="taskFormLabel" for="note">Note</label>
            <textarea
              id="note"
              placeholder="Details (optional)"
              class="inputField textArea"
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <button type="button" id="logTask" class="btn">Create Task</button>
  </form>
</div>
